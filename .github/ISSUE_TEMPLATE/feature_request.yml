name: Feature request
description: Suggest something Weatherspell should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help with?
      description: The situation or need behind the idea.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What should Weatherspell do?
      description: Describe the behaviour you have in mind, including how it should read or work with the keyboard if that matters.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
