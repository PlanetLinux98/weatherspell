name: CI

# Build and test every push to main and every pull request. The Release
# workflow handles v* tags; this one deliberately ignores them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the version from the nearest v* tag.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Weatherspell.slnx

      - name: Build
        run: dotnet build Weatherspell.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Weatherspell.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

      # The exe from this build, so a PR can be tried without a local build.
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Weatherspell
          path: src/Weatherspell/bin/Release/net48/Weatherspell.exe
