# cargo-about's settings for THIRD-PARTY-NOTICES.md (tools/Update-Notices.ps1).
# Where a crate offers a choice, the first licence here that it offers is
# the one credited. Only what goes into the shipped apps is listed (the
# Windows exe, the Mac app's two halves, the Linux AppImage; one page
# covers all three): no build or test dependencies, and not the
# workspace's own crates. tests/notices.rs checks the same targets.
accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "Unlicense",
]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
workarounds = ["ring", "rustls"]
