[package]
name = "wx-accessibility"
version = "0.0.0"
description = "Accessibility pieces for wxWidgets apps (through wxDragon): announcements to screen readers, and later the lint and test tools"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wxdragon = "=0.9.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }
# The #[implement] macro names this crate directly.
windows-core = "0.62"
