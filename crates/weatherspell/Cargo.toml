[package]
name = "weatherspell"
version = "0.0.0"
description = "Weatherspell: current conditions, forecast and severe weather alerts as readable text"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
weatherspell-core = { path = "../weatherspell-core", features = ["net"] }
wx-accessibility = { path = "../wx-accessibility" }
wxdragon = "=0.9.22"
jiff = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
# USER_GUIDE.md into the page F1 opens; nothing of it ships.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Every window built and checked by the accessibility lint, on the main
# thread, as wxWidgets wants.
[[test]]
name = "accessibility"
harness = false

# The build scripts' own tests (lib.rs includes them).
[dev-dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
