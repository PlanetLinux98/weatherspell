[package]
name = "weatherspell"
version = "0.0.0"
description = "Weatherspell: current conditions, forecast and severe weather alerts as readable text"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
weatherspell-core = { path = "../weatherspell-core", features = ["net"] }
wx-accessibility = { path = "../wx-accessibility" }
wxdragon = "=0.9.22"
jiff = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
