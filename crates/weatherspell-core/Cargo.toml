[package]
name = "weatherspell-core"
version = "0.0.0"
description = "Weatherspell's logic: weather services, forecast text, alerts, settings; no user interface"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
regex = "1"
# The Bureau of Meteorology's outlines come zipped (shapes.rs); ureq
# already brings it in for gzip.
flate2 = "1"
# The real network client, for the app and the example; the core's own
# logic and tests never touch the network.
ureq = { version = "3", optional = true, default-features = false, features = ["rustls", "platform-verifier", "gzip", "win-system-proxy"] }
# SHA-256 for a downloaded update (updates.rs); rustls already brings it
# in, so it rides with the network client and adds no crate.
ring = { version = "0.17", optional = true }

[features]
net = ["dep:ureq", "dep:ring"]

[[example]]
name = "forecast"
required-features = ["net"]

[[example]]
name = "update"
required-features = ["net"]
