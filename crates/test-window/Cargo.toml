[package]
name = "test-window"
version = "0.0.0"
description = "A throwaway window that checks what wxWidgets gives screen readers (#24, step 1)"
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "test-window"

[dependencies]
wxdragon = "=0.9.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The #[implement] macro names this crate directly.
windows-core = "0.62"

[build-dependencies]
embed-resource = "3"
